sensor:
  - platform: serial
    #serial_port: /dev/ttyUSB0
    serial_port: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
    baudrate: 115200
    name: "Arduino Nano Serial"
    # was 2000000

shell_command:
  set_sensor: /config/nano-send-command.sh "ss" {{ interval }} {{ samples }}
  set_ups_supply: /config/nano-send-command.sh "sp" {{ enable }}
  set_ups_battery: /config/nano-send-command.sh "sb" {{ enable }}
  set_ups_charging: /config/nano-send-command.sh "sc" {{ enable }}
  set_ups_mah: /config/nano-send-command.sh "smah" {{ mah }}
  set_ups_shutdown_now: /config/nano-send-command.sh "sdnow" {{ enable }}

template: !include template.yaml