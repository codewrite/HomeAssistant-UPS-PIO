### template.yaml

- sensor:
  - name: "Serial rpi"
    state: >
      {{ (states('sensor.arduino_nano_serial') | replace("'", '"') | from_json).rpi | default(this.state) }}
  - name: "Serial vcc"
    state: >
      {{ (states('sensor.arduino_nano_serial') | replace("'", '"') | from_json).vcc | default(this.state) }}
  - name: "Serial bat"
    state: >
      {{ (states('sensor.arduino_nano_serial') | replace("'", '"') | from_json).bat | default(this.state) }}
  - name: "Serial Sensors"
    state: >
      {{ (states('sensor.arduino_nano_serial') | replace("'", '"') | from_json).Sensors | default(this.state) }}
  - name: "Serial Control"
    state: >
      {{ (states('sensor.arduino_nano_serial') | replace("'", '"') | from_json).Control | default(this.state) }}

- trigger:
  - platform: state
    entity_id: sensor.serial_sensors
  number:
  - name: UPS Sensor Interval
    unique_id: ups_sensor_interval
    state: >
      {% set data = trigger.to_state.state | replace("'", '"') | from_json %}
      {{ data.Interval | default(this.state) }}
    set_value:
      - action: script.set_sensor_interval
        data:
          interval: "{{ value }}"
          samples: >
             {% set data = trigger.to_state.state | replace("'", '"') | from_json %}
             {{ data.AvgSamples | default(this.state) }}
    step: 1
    min: 100
    max: 60000
    unit_of_measurement: ms

  - name: UPS Sensor Average Samples
    unique_id: ups_sensor_avg_samples
    state: >
      {% set data = trigger.to_state.state | replace("'", '"') | from_json %}
      {{ data.AvgSamples | default(this.state) }}
    set_value:
      - action: script.set_sensor_interval
        data:
          interval: >
            {% set data = trigger.to_state.state | replace("'", '"') | from_json %}
            {{ data.Interval | default(this.state) }}
          samples: "{{ value }}"
    step: 1
    min: 1
    max: 60000

- trigger:
  - platform: state
    entity_id: sensor.serial_control
  switch:
  - name: "UPS Supply On"
    unique_id: ups_supply_on
    state: >
      {% set data = trigger.to_state.state | replace("'", '"') | from_json %}
      {{ data.Power | default(this.state) }}
    turn_on:
    - action: script.set_ups_supply
      data:
        enable: 1
    turn_off:
    - action: script.set_ups_supply
      data:
        enable: 0

  - name: "UPS Battery On"
    unique_id: ups_battery_on
    state: >
      {% set data = trigger.to_state.state | replace("'", '"') | from_json %}
      {{ data.Battery | default(this.state) }}
    turn_on:
    - action: script.set_ups_battery
      data:
        enable: 1
    turn_off:
    - action: script.set_ups_battery
      data:
        enable: 0

  - name: "UPS Control Shutdown Now"
    unique_id: ups_control_shutdown_now
    state: >
      {% set data = trigger.to_state.state | replace("'", '"') | from_json %}
      {{ data.ShutdownNow | default(this.state) }}
    turn_on:
    - action: script.set_ups_shutdown_now
      data:
        enable: 1
    turn_off:
    - action: script.set_ups_shutdown_now
      data:
        enable: 0
  number:
  - name: "UPS Control Charging"
    unique_id: ups_control_charging
    state: >
      {% set data = trigger.to_state.state | replace("'", '"') | from_json %}
      {{ data.Charging | default(this.state) }}
    set_value:
      - action: script.set_ups_charging
        data:
          enable: "{{ value }}"
          samples: >
             {% set data = trigger.to_state.state | replace("'", '"') | from_json %}
             {{ data.charging | default(this.state) }}
    step: 1
    min: 0
    max: 255

